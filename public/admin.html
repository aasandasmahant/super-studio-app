<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Super Studio Admin</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0b1117;color:#e6edf3;padding:16px}
  .card{max-width:680px;margin:0 auto;background:#131c26;border:1px solid #263445;border-radius:10px;padding:16px}
  h1{margin:0 0 8px;font-size:20px}
  p{margin:0 0 12px;color:#9fb0c2;font-size:14px}
  input,button{width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #304154;background:#0b1117;color:#e6edf3;font-size:15px}
  button{background:#1f6feb;border:none;font-weight:600;cursor:pointer}
  pre{background:#090d12;padding:12px;border-radius:8px;overflow:auto;font-size:13px;border:1px solid #1e2a38}
</style>
</head>
<body>
  <div class="card">
    <h1>Super Studio Admin Panel</h1>
    <p>लोकल और सर्वर दोनों के लिए हल्का डार्क-मोड एडमिन डैशबोर्ड।</p>
    <input id="adminKey" type="password" placeholder="ADMIN_KEY डालें" />
    <button onclick="checkPanel()">Status (/admin-panel/status) जाँचें</button>
    <button onclick="checkMeta()">Meta (/admin/meta) जाँचें</button>
    <pre id="out">तैयार है।</pre>
  </div>
  <script>
    async function checkPanel(){
      const key = document.getElementById('adminKey').value.trim();
      const out = document.getElementById('out');
      out.textContent = 'Loading...';
      try{
        const r = await fetch('/admin-panel/status', { headers: { 'x-admin-key': key } });
        out.textContent = JSON.stringify(await r.json(), null, 2);
      }catch(e){ out.textContent = String(e); }
    }
    async function checkMeta(){
      const out = document.getElementById('out');
      out.textContent = 'Loading...';
      try{
        const r = await fetch('/admin/meta');
        out.textContent = JSON.stringify(await r.json(), null, 2);
      }catch(e){ out.textContent = String(e); }
    }
  </script>
</body>
</html>
